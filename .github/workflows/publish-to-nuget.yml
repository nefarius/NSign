name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore nsign.sln

      - name: Build
        run: dotnet build nsign.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test nsign.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-test-results
          path: TestResults/

      - name: Pack
        run: dotnet pack .\src\nsign\nsign.csproj -c Release --no-build -o .\artifacts\nupkg

      - name: Verify package
        shell: pwsh
        run: ./scripts/Verify-Package.ps1 -PackageDirectory ./artifacts/nupkg

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nupkg
          path: artifacts/nupkg/

  publish:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack .\src\nsign\nsign.csproj -c Release -o .\artifacts\nupkg

      - name: Verify package
        shell: pwsh
        run: ./scripts/Verify-Package.ps1 -PackageDirectory ./artifacts/nupkg

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Nefarius

      - name: Push to nuget.org
        run: >
          dotnet nuget push .\artifacts\nupkg\*.nupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
          && dotnet nuget push .\artifacts\nupkg\*.snupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate


  release:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved version: $version"

      - name: Publish standalone win-x64
        run: dotnet publish .\src\nsign\nsign.csproj -c Release -f net10.0 -p:PublishProfile=Standalone-win-x64

      - name: Pack release archive
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $stage = Join-Path $PWD "artifacts/release-stage/nsign-$env:VERSION-win-x64"
          $outDir = Join-Path $PWD 'artifacts/release'
          New-Item -ItemType Directory -Force -Path $stage, $outDir | Out-Null
          Copy-Item .\artifacts\nsign\nsign.exe $stage
          if (Test-Path .\LICENSE) { Copy-Item .\LICENSE $stage }
          if (Test-Path .\THIRD-PARTY-NOTICES.md) { Copy-Item .\THIRD-PARTY-NOTICES.md $stage }
          $zip = Join-Path $outDir "nsign-$env:VERSION-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$(Split-Path $zip -Leaf)  $hash" | Set-Content -Path (Join-Path $outDir 'checksums.txt') -Encoding utf8
          Get-Content (Join-Path $outDir 'checksums.txt')

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            artifacts/release/nsign-${{ steps.ver.outputs.version }}-win-x64.zip
            artifacts/release/checksums.txt
